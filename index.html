<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca multimedia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{ --ink:#14181F; --panel:#1B2129; --panel-2:#212A34; --border:#2A333F; --text:#E8ECF1; --muted:#8A95A3; --faint:#5B6571; --accent:#E0A458; --accent-press:#C98F44; --radius:12px; --side-w:300px; }
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0; background:var(--ink); color:var(--text); font-family:"Inter",system-ui,sans-serif; font-size:15px; line-height:1.5; display:grid; grid-template-columns:var(--side-w) 6px 1fr; height:100vh; overflow:hidden}
  @media (max-width:760px){ body{grid-template-columns:1fr; grid-template-rows:auto 1fr; overflow:auto; height:auto; min-height:100vh} .resizer{display:none} }
  .resizer{cursor:col-resize; background:var(--border)} .resizer:hover{background:var(--accent)}

  .side{background:var(--panel); border-right:1px solid var(--border); display:flex; flex-direction:column; min-height:0}
  .brand{display:flex; align-items:center; gap:10px; padding:20px 20px 14px; border-bottom:1px solid var(--border)}
  .brand h1{font-family:"Space Grotesk",sans-serif; font-size:17px; font-weight:600; letter-spacing:-.01em; margin:0}
  .brand span{font-size:11px; color:var(--muted); letter-spacing:.04em; text-transform:uppercase}
  .tabs{display:flex; gap:6px; padding:12px 16px 0}
  .tab{flex:1; text-align:center; padding:8px 6px; border-radius:8px; background:var(--ink); border:1px solid var(--border); color:var(--muted); cursor:pointer; font:inherit; font-size:13px; font-weight:500}
  .tab.active{background:var(--panel-2); color:var(--accent); border-color:var(--accent)}
  .search{padding:14px 16px; border-bottom:1px solid var(--border)}
  .search input{width:100%; background:var(--ink); border:1px solid var(--border); color:var(--text); border-radius:9px; padding:10px 12px; font:inherit; outline:none}
  .search input:focus{border-color:var(--accent)}
  .scope{display:flex; align-items:center; gap:6px; margin-top:10px; flex-wrap:wrap}
  .scope .lab{font-size:12px; color:var(--faint)}
  .scope button{padding:5px 11px; border-radius:7px; background:var(--ink); border:1px solid var(--border); color:var(--muted); cursor:pointer; font:inherit; font-size:12px}
  .scope button.active{color:var(--accent); border-color:var(--accent); background:var(--panel-2)}
  .courses{flex:1; overflow:auto; padding:8px}
  .courses .label{font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--faint); padding:10px 12px 6px}
  .course{display:flex; align-items:flex-start; gap:10px; width:100%; text-align:left; background:none; border:0; color:var(--text); font:inherit; cursor:pointer; padding:9px 12px; border-radius:9px}
  .course:hover{background:var(--panel-2)} .course.active{background:var(--panel-2); color:var(--accent)}
  .course svg{flex:0 0 auto; opacity:.7; margin-top:2px} .course span{overflow-wrap:anywhere; line-height:1.35}
  .side-foot{padding:14px 16px; border-top:1px solid var(--border); font-size:12px; color:var(--muted); display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap}
  .linkbtn{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:0} .linkbtn:hover{text-decoration:underline}

  .main{min-height:0; overflow:auto; padding:24px 32px 48px}
  .crumbs{display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:13px; color:var(--muted); margin-bottom:18px}
  .crumbs button{background:none;border:0;color:var(--muted);font:inherit;cursor:pointer;padding:0} .crumbs button:hover{color:var(--accent)}
  .crumbs .sep{color:var(--faint)} .crumbs .cur{color:var(--text)}
  .topline{display:flex; align-items:center; gap:14px; margin-bottom:18px; flex-wrap:wrap}
  .topline h2{font-family:"Space Grotesk",sans-serif; font-size:23px; font-weight:600; letter-spacing:-.02em; margin:0}
  .topline .count{color:var(--muted); font-size:13px}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px}
  .grid.folders{grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); margin-bottom:26px}
  .grid.photos{grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; cursor:pointer; text-align:left; padding:0; color:inherit; font:inherit; transition:border-color .15s, transform .15s}
  .card:hover{border-color:var(--accent); transform:translateY(-2px)}
  .thumb{aspect-ratio:16/9; background:var(--panel-2); position:relative; display:flex; align-items:center; justify-content:center}
  .card.photo .thumb{aspect-ratio:1/1}
  .thumb img{width:100%; height:100%; object-fit:cover; display:block}
  .thumb .badge{position:absolute; width:42px; height:42px; border-radius:50%; background:rgba(20,24,31,.7); display:flex; align-items:center; justify-content:center}
  .card .name{padding:10px 12px; font-size:13px; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .card .vpath{padding:0 12px 10px; font-size:12px; color:var(--faint); margin-top:-3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .folder-card{display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); cursor:pointer; text-align:left; color:inherit; font:inherit; padding:14px 15px; transition:border-color .15s, transform .15s}
  .folder-card:hover{border-color:var(--accent); transform:translateY(-2px)}
  .folder-card .fc-icon{flex:0 0 auto; color:var(--accent)}
  .folder-card .fc-name{font-size:14px; line-height:1.3; overflow-wrap:anywhere} .folder-card .fc-sub{font-size:12px; color:var(--faint)}

  .player{max-width:980px}
  .backbtn{background:none;border:1px solid var(--border);color:var(--muted);font:inherit;cursor:pointer;border-radius:8px;padding:7px 12px;margin-bottom:16px}
  .backbtn:hover{color:var(--text);border-color:var(--accent)}
  .frame{aspect-ratio:16/9; width:100%; border-radius:var(--radius); overflow:hidden; border:1px solid var(--border); background:#000}
  .frame.audio{aspect-ratio:auto; height:160px}
  .frame iframe{width:100%; height:100%; border:0}
  .player h2{font-family:"Space Grotesk",sans-serif; font-weight:600; margin:18px 0 4px; letter-spacing:-.01em}
  .player .vpath{color:var(--muted); font-size:13px}

  .state{display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; text-align:center; gap:14px; padding:40px}
  .state h3{font-family:"Space Grotesk",sans-serif; font-weight:600; margin:0; font-size:20px}
  .state p{color:var(--muted); margin:0; max-width:440px}
  .btn{background:var(--accent); color:#1A140A; border:0; border-radius:10px; font:inherit; font-weight:600; padding:11px 20px; cursor:pointer; text-decoration:none; display:inline-block}
  .btn.ghost{background:none; color:var(--text); border:1px solid var(--border)} .btn.ghost:hover{border-color:var(--accent); background:none}
  .btn:hover{background:var(--accent-press)} .btn:active{transform:translateY(1px)}
  .err{color:#E98F8F; background:rgba(233,143,143,.08); border:1px solid rgba(233,143,143,.25); border-radius:10px; padding:12px 14px; font-size:14px; max-width:520px}
  .spinner{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hidden{display:none!important}

  /* --- foco visible para navegación con el mando de la TV --- */
  .card:focus,.folder-card:focus,.course:focus,.tab:focus,.scope button:focus,
  .crumbs button:focus,.backbtn:focus,.btn:focus,.linkbtn:focus,#searchBox:focus,
  .lb-nav:focus,.lb-close:focus,.lb-bar select:focus,.player .frame iframe:focus{
    outline:3px solid var(--accent); outline-offset:2px;
  }
  .card:focus,.folder-card:focus{ outline:4px solid var(--accent); outline-offset:2px; border-color:var(--accent); transform:translateY(-2px); }
  .course:focus{ background:var(--panel-2); }
  @supports selector(:focus-visible){
    .card:focus:not(:focus-visible),.folder-card:focus:not(:focus-visible),
    .course:focus:not(:focus-visible),.tab:focus:not(:focus-visible),
    .scope button:focus:not(:focus-visible),.btn:focus:not(:focus-visible),
    .linkbtn:focus:not(:focus-visible),.crumbs button:focus:not(:focus-visible),
    .backbtn:focus:not(:focus-visible){ outline:none; }
  }
  .main,.courses{ scroll-behavior:smooth; }
  .card,.folder-card,.course{ scroll-margin:100px; }

  /* lightbox / pase de diapositivas */
  .lightbox{position:fixed; top:0; left:0; right:0; bottom:0; width:100%; height:100%; z-index:50; background:#0a0c10; overflow:hidden}
  .lb-stage{position:absolute; top:0; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:center; padding:0; text-align:center}
  /* imagen: posicionamiento absoluto + margin:auto = centrado y "contain" a prueba de bugs de flexbox (vertical y horizontal) */
  .lb-stage img{position:absolute; top:0; left:0; right:0; bottom:0; margin:auto; max-width:100%; max-height:100%; width:auto; height:auto; display:block}
  .lb-nav{position:absolute; top:50%; transform:translateY(-50%); z-index:3; background:rgba(27,33,41,.7); border:1px solid var(--border); color:var(--text); width:48px; height:48px; border-radius:50%; font-size:26px; cursor:pointer; display:flex; align-items:center; justify-content:center}
  .lb-nav:hover{border-color:var(--accent); color:var(--accent)} .lb-prev{left:18px} .lb-next{right:18px}
  .lb-close{position:absolute; top:16px; right:18px; z-index:3; background:none; border:0; color:var(--muted); font-size:30px; cursor:pointer; line-height:1} .lb-close:hover{color:var(--text)}
  .lb-bar{position:absolute; left:0; right:0; bottom:0; z-index:3; display:flex; align-items:center; gap:14px; justify-content:center; padding:16px 14px 18px; background:linear-gradient(to top, rgba(8,10,14,.94), rgba(8,10,14,.5) 65%, rgba(8,10,14,0)); flex-wrap:wrap; transition:opacity .25s}
  .lb-bar label{color:var(--muted); font-size:13px; display:flex; align-items:center; gap:6px}
  .lb-bar select{background:var(--ink); color:var(--text); border:1px solid var(--border); border-radius:7px; padding:5px 8px; font:inherit; font-size:13px; cursor:pointer}
  .btn.ghost.on{border-color:var(--accent); color:var(--accent)}
  .lb-bar .lb-counter{color:var(--muted); font-size:13px} .lb-bar .lb-caption{color:var(--faint); font-size:13px; max-width:50vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .lb-nav,.lb-close{transition:opacity .25s}
  .lightbox.tvhide .lb-bar,.lightbox.tvhide .lb-nav,.lightbox.tvhide .lb-close{opacity:0;pointer-events:none}
  .lightbox.tvhide{cursor:none}

  /* botones flotantes de scroll (red de seguridad si el mando no mueve el foco) */
  .tvscroll{position:fixed; right:14px; top:50%; transform:translateY(-50%); z-index:40; display:flex; flex-direction:column; gap:10px; opacity:.4; transition:opacity .2s}
  .tvscroll:hover,.tvscroll:focus-within{opacity:1}
  .tvscroll button{width:52px; height:52px; border-radius:50%; background:rgba(27,33,41,.92); border:1px solid var(--border); color:var(--text); font-size:19px; cursor:pointer; display:flex; align-items:center; justify-content:center}
  .tvscroll button:hover{border-color:var(--accent); color:var(--accent)}
  .tvscroll button:focus{border-color:var(--accent); color:var(--accent); outline:3px solid var(--accent); outline-offset:2px}
  @media (max-width:760px){ .tvscroll{right:8px} }
  ::-webkit-scrollbar{width:14px;height:14px} ::-webkit-scrollbar-thumb{background:var(--faint);border-radius:7px} ::-webkit-scrollbar-thumb:hover{background:var(--accent)}
</style>
</head>
<body>

  <aside class="side">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><rect x="2.5" y="4" width="19" height="14" rx="2.5" stroke="#E0A458" stroke-width="1.6"/><circle cx="9" cy="10" r="1.6" fill="#E0A458"/><path d="M5 16l4-3 3 2 3-3 4 4" stroke="#E0A458" stroke-width="1.5" fill="none"/></svg>
      <div><h1>Multimedia</h1><span>vídeos y fotos</span></div>
    </div>
    <div class="tabs hidden" id="tabs"></div>
    <div class="search">
      <input id="searchBox" type="search" placeholder="Buscar…" autocomplete="off" disabled>
      <div class="scope hidden" id="scope"></div>
    </div>
    <nav class="courses" id="courseList"><div class="label">Carpetas</div></nav>
    <div class="side-foot">
      <span id="userState">Sin conectar</span>
      <span style="display:flex;gap:12px">
        <button class="linkbtn hidden" id="refreshBtn">Actualizar</button>
        <button class="linkbtn hidden" id="signOut">Salir</button>
      </span>
    </div>
  </aside>

  <div class="resizer" id="resizer" title="Arrastra para redimensionar"></div>
  <main class="main" id="main"></main>

  <div class="tvscroll" id="tvscroll">
    <button id="tvUp" title="Subir" aria-label="Subir">▲</button>
    <button id="tvBack" title="Volver" aria-label="Volver">◀</button>
    <button id="tvDown" title="Bajar" aria-label="Bajar">▼</button>
  </div>

  <div class="lightbox hidden" id="lightbox">
    <button class="lb-close" id="lbClose">×</button>
    <button class="lb-nav lb-prev" id="lbPrev">‹</button>
    <div class="lb-stage" id="lbStage"></div>
    <button class="lb-nav lb-next" id="lbNext">›</button>
    <div class="lb-bar">
      <button class="btn ghost" id="lbPlay">▶ Reproducir</button>
      <button class="btn ghost" id="lbLoop" title="Repetir en bucle">🔁 Bucle</button>
      <button class="btn ghost" id="lbFull" title="Ocultar controles / pantalla completa (F)">⛶ Solo imagen</button>
      <label>Intervalo
        <select id="lbInterval">
          <option value="2">2 s</option><option value="3">3 s</option><option value="4">4 s</option>
          <option value="5">5 s</option><option value="7">7 s</option><option value="10">10 s</option><option value="15">15 s</option>
        </select>
      </label>
      <span class="lb-counter" id="lbCounter"></span>
      <span class="lb-caption" id="lbCaption"></span>
    </div>
  </div>

<script>
/* ======================= AJUSTES (rellena una vez) ======================= */
const HARD_CLIENT_ID  = '314287805294-tva4np726d008slj2nlnd453ndvej7rg.apps.googleusercontent.com';   // '123-abc.apps.googleusercontent.com'
const HARD_ROOT_VIDEO = '1lAGHl-rsuY_qd8adCb4_w0hD8kdsNXO7';   // carpeta compartida de VÍDEOS (y audio)
const HARD_ROOT_PHOTO = '1y9-sgxf6bamDOUPIWho4w7mLx4BgT1Ny';   // carpeta compartida de FOTOS
const SLIDE_SECONDS   = 4;     // segundos por foto en el pase de diapositivas
const SCOPES = 'https://www.googleapis.com/auth/drive.readonly';
/* ========================================================================= */

const MEDIA_CLAUSE = "(mimeType contains 'video/' or mimeType contains 'audio/' or mimeType contains 'image/')";
const MODES = [];
if(HARD_ROOT_VIDEO.trim()) MODES.push({key:'video', label:'Vídeos', root:HARD_ROOT_VIDEO.trim(), clause:MEDIA_CLAUSE, word:'elemento'});
if(HARD_ROOT_PHOTO.trim()) MODES.push({key:'photo', label:'Fotos',  root:HARD_ROOT_PHOTO.trim(), clause:MEDIA_CLAUSE, word:'elemento'});

const $ = (id)=>document.getElementById(id);
const main = $('main');
const clientId = ()=>HARD_CLIENT_ID.trim();
const modeOf = (k)=>MODES.find(m=>m.key===k);
function typeOf(mime){ if(mime.startsWith('image/')) return 'image'; if(mime.startsWith('audio/')) return 'audio'; return 'video'; }

const state = {}; let activeMode = MODES[0]||null; let searchScope = activeMode?activeMode.key:null;
let tree=null, flat=[], currentPath=[], returnFn=null, searching=false, viewItems=[];

/* token + caché */
function saveToken(t,s){ localStorage.setItem('mm_token', JSON.stringify({t, e:Date.now()+(s||3600)*1000})); }
function loadToken(){ try{ const o=JSON.parse(localStorage.getItem('mm_token')); if(o && o.e-Date.now()>60000) return o.t; }catch(e){} return null; }
function clearToken(){ localStorage.removeItem('mm_token'); }
function cacheTree(root,t){ try{ localStorage.setItem('mm_tree_v2_'+root, JSON.stringify(t)); }catch(e){} }
function loadCachedTree(root){ try{ return JSON.parse(localStorage.getItem('mm_tree_v2_'+root)); }catch(e){ return null; } }

/* barra redimensionable */
(()=>{ const w=localStorage.getItem('mm_side_w'); if(w) document.documentElement.style.setProperty('--side-w', w); })();
(()=>{ const rz=$('resizer'); let drag=false;
  rz.addEventListener('pointerdown', e=>{drag=true; rz.setPointerCapture(e.pointerId); document.body.style.userSelect='none';});
  window.addEventListener('pointermove', e=>{ if(!drag) return; document.documentElement.style.setProperty('--side-w', Math.min(700,Math.max(220,e.clientX))+'px'); });
  window.addEventListener('pointerup', ()=>{ if(!drag) return; drag=false; document.body.style.userSelect=''; localStorage.setItem('mm_side_w', getComputedStyle(document.documentElement).getPropertyValue('--side-w').trim()); });
})();

/* OAuth */
let tokenClient=null, accessToken=null, hasConsented=false, pending=null;
function whenGisReady(cb){ const t=setInterval(()=>{ if(window.google&&google.accounts){ clearInterval(t); cb(); } },100); }
function initTokenClient(){ tokenClient=google.accounts.oauth2.initTokenClient({ client_id:clientId(), scope:SCOPES,
  callback:(r)=>{ if(r.error){ if(pending){pending.reject(r); pending=null;} return; } accessToken=r.access_token; hasConsented=true; saveToken(r.access_token,r.expires_in); const p=pending; pending=null; if(p) p.resolve(); } }); }
function requestToken(silent){ return new Promise((res,rej)=>{ pending={resolve:res,reject:rej}; tokenClient.requestAccessToken({prompt: silent?'':(hasConsented?'':'consent')}); }); }

/* Drive */
async function drive(params, retry=true){
  const url=new URL('https://www.googleapis.com/drive/v3/files');
  Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
  const r=await fetch(url,{headers:{Authorization:'Bearer '+accessToken}});
  if(r.status===401 && retry){ try{ await requestToken(true); }catch(e){ clearToken(); showWelcome(); throw new Error('Sesión caducada.'); } return drive(params,false); }
  if(!r.ok) throw new Error('Drive API '+r.status);
  return r.json();
}
function limiter(max){ let active=0; const q=[]; const next=()=>{ if(active>=max||!q.length) return; active++; const {fn,res,rej}=q.shift(); fn().then(res,rej).finally(()=>{active--; next();}); }; return fn=>new Promise((res,rej)=>{ q.push({fn,res,rej}); next(); }); }
const limit = limiter(6);

async function listChildren(folderId, clause){
  const folders=[], items=[]; let pageToken;
  do{
    const params={ q:`'${folderId}' in parents and trashed=false and (mimeType='application/vnd.google-apps.folder' or ${clause})`,
      fields:'nextPageToken, files(id,name,mimeType,thumbnailLink)', orderBy:'folder,name', pageSize:'1000' };
    if(pageToken) params.pageToken=pageToken;
    const r=await drive(params);
    for(const f of (r.files||[])){
      if(f.mimeType==='application/vnd.google-apps.folder') folders.push({id:f.id,name:f.name});
      else items.push({id:f.id,name:f.name,thumb:f.thumbnailLink,t:typeOf(f.mimeType)});
    }
    pageToken=r.nextPageToken;
  } while(pageToken);
  return {folders, items};
}
let crawled=0;
async function crawl(id,name,clause){
  const {folders,items}=await limit(()=>listChildren(id,clause));
  crawled++; const el=$('crawlStatus'); if(el) el.textContent=`Indexando… ${crawled} carpetas`;
  const node={id,name,items,folders:[]};
  node.folders=await Promise.all(folders.map(f=>crawl(f.id,f.name,clause)));
  return node;
}
function buildIndex(node, path, out){ for(const it of node.items) out.push({id:it.id,name:it.name,thumb:it.thumb,t:it.t,path:path.join(' / ')}); for(const f of node.folders) buildIndex(f,[...path,f.name],out); return out; }
function countItems(node){ let n=node.items.length; node.folders.forEach(f=>n+=countItems(f)); return n; }
function word(n, mode){ const w=mode.word; return `${n} ${w}${n!==1?'s':''}`; }

async function ensureData(mode){
  if(state[mode.key]) return;
  const cached=loadCachedTree(mode.root);
  if(cached){ state[mode.key]={tree:cached, flat:buildIndex(cached,[],[])}; return; }
  crawled=0; const t=await crawl(mode.root, mode.label, mode.clause);
  cacheTree(mode.root,t); state[mode.key]={tree:t, flat:buildIndex(t,[],[])};
}
function spinner(text){ return `<div class="state"><div class="spinner"></div><p id="crawlStatus">${text}</p></div>`; }

/* imágenes a resolución completa vía API */
const imgCache=new Map();
async function getImageUrl(id){
  if(imgCache.has(id)) return imgCache.get(id);
  const u=`https://www.googleapis.com/drive/v3/files/${id}?alt=media`;
  let r=await fetch(u,{headers:{Authorization:'Bearer '+accessToken}});
  if(r.status===401){ await requestToken(true); r=await fetch(u,{headers:{Authorization:'Bearer '+accessToken}}); }
  if(!r.ok) throw new Error('img '+r.status);
  const url=URL.createObjectURL(await r.blob()); imgCache.set(id,url); return url;
}

/* flujo */
function boot(){
  if(!clientId() || !MODES.length){ main.innerHTML=`<div class="state"><h3>Falta configurar la app</h3><div class="err">Rellena <b>HARD_CLIENT_ID</b> y al menos <b>HARD_ROOT_VIDEO</b> o <b>HARD_ROOT_PHOTO</b>.</div></div>`; return; }
  whenGisReady(()=>{ initTokenClient(); const t=loadToken(); if(t){ accessToken=t; hasConsented=true; onSignedIn(); } else showWelcome(); });
}
function showWelcome(){
  $('userState').textContent='Sin conectar'; ['signOut','refreshBtn','tabs','scope'].forEach(i=>$(i).classList.add('hidden')); $('searchBox').disabled=true;
  main.innerHTML=`<div class="state"><svg width="40" height="40" viewBox="0 0 24 24" fill="none"><rect x="2.5" y="4" width="19" height="14" rx="2.5" stroke="#E0A458" stroke-width="1.4"/><circle cx="9" cy="10" r="1.6" fill="#E0A458"/><path d="M5 16l4-3 3 2 3-3 4 4" stroke="#E0A458" stroke-width="1.4" fill="none"/></svg>
    <h3>Accede para ver el contenido</h3><p>Inicia sesión con la cuenta que tiene acceso. Solo lectura. La sesión se recuerda al recargar.</p>
    <button class="btn" id="connectBtn">Acceder con Google</button></div>`;
  $('connectBtn').onclick=()=> requestToken(false).then(onSignedIn).catch(()=> showError('No se pudo acceder. Revisa que tu cuenta tenga acceso y esté autorizada.'));
  $('connectBtn').focus({preventScroll:true});
}
function onSignedIn(){ $('userState').textContent='Conectado'; $('signOut').classList.remove('hidden'); $('refreshBtn').classList.remove('hidden'); $('searchBox').disabled=false; renderTabs(); renderScope(); ensureMode(activeMode); }
function renderTabs(){ const c=$('tabs'); if(MODES.length<2){ c.classList.add('hidden'); return; } c.classList.remove('hidden');
  c.innerHTML=MODES.map(m=>`<button class="tab${m.key===activeMode.key?' active':''}" data-k="${m.key}">${m.label}</button>`).join('');
  c.querySelectorAll('.tab').forEach(b=> b.onclick=()=>{ const m=modeOf(b.dataset.k); if(m.key!==activeMode.key) ensureMode(m); }); }
function renderScope(){ const c=$('scope'); if(MODES.length<2){ c.classList.add('hidden'); return; } c.classList.remove('hidden');
  c.innerHTML=`<span class="lab">Buscar en:</span>`+MODES.map(m=>`<button class="${m.key===searchScope?'active':''}" data-k="${m.key}">${m.label}</button>`).join('');
  c.querySelectorAll('button[data-k]').forEach(b=> b.onclick=()=>{ searchScope=b.dataset.k; renderScope(); const term=$('searchBox').value.trim(); if(term.length>=2) runSearch(term); }); }
async function ensureMode(mode){
  activeMode=mode; searchScope=mode.key; renderTabs(); renderScope(); $('searchBox').value=''; searching=false;
  $('searchBox').placeholder = `Buscar en ${mode.label}…`;
  if(!state[mode.key]) main.innerHTML=spinner(`Indexando ${mode.label.toLowerCase()}…`);
  try{ await ensureData(mode); }catch(e){ showError('No se pudo leer la biblioteca. '+e.message); return; }
  tree=state[mode.key].tree; flat=state[mode.key].flat; renderSidebar(); showHome();
}
function renderSidebar(){
  const list=$('courseList'); list.innerHTML='<div class="label">Carpetas</div>';
  if(!tree.folders.length && !tree.items.length){ list.insertAdjacentHTML('beforeend','<div style="padding:12px;color:var(--muted);font-size:13px">No hay nada. Revisa el acceso a la carpeta compartida.</div>'); return; }
  if(tree.items.length){ const b=document.createElement('button'); b.className='course'; b.title='Raíz'; b.innerHTML=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.5"/></svg><span>(Sin carpeta)</span>`; b.onclick=()=>openFolder([tree],b); list.appendChild(b); }
  tree.folders.forEach(c=>{ const b=document.createElement('button'); b.className='course'; b.title=c.name;
    b.innerHTML=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" stroke="currentColor" stroke-width="1.5"/></svg><span></span>`;
    b.querySelector('span').textContent=c.name; b.onclick=()=>openFolder([c],b); list.appendChild(b); });
}
function setActive(btn){ document.querySelectorAll('.course').forEach(c=>c.classList.remove('active')); if(btn) btn.classList.add('active'); }
function showHome(){ setActive(null); currentPath=[]; searching=false; returnFn=showHome;
  main.innerHTML=`<div class="state"><h3>Elige una carpeta</h3><p>Selecciona una carpeta a la izquierda, o busca por nombre.</p></div>`;
  const c=document.querySelector('#courseList .course'); if(c) c.focus({preventScroll:true}); }

function openFolder(pathNodes, sidebarBtn){
  currentPath=pathNodes; searching=false; returnFn=()=>openFolder(pathNodes);
  if(sidebarBtn) setActive(sidebarBtn); else { const rn=pathNodes[0].name; document.querySelectorAll('.course').forEach(c=>c.classList.toggle('active', c.title===rn)); }
  const node=pathNodes[pathNodes.length-1];
  let crumbs=`<div class="crumbs"><button onclick="showHome()">Inicio</button>`;
  pathNodes.forEach((n,i)=>{ const last=i===pathNodes.length-1; crumbs+=`<span class="sep">/</span>`+(last?`<span class="cur">${escHtml(n.name)}</span>`:`<button data-i="${i}">${escHtml(n.name)}</button>`); }); crumbs+=`</div>`;

  const folderCards=node.folders.map((f,i)=>`<button class="folder-card" data-fi="${i}">
    <span class="fc-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" stroke="currentColor" stroke-width="1.6"/></svg></span>
    <span><span class="fc-name">${escHtml(f.name)}</span><br><span class="fc-sub">${word(countItems(f),activeMode)}</span></span></button>`).join('');

  viewItems=node.items.slice();
  const imgs=node.items.filter(x=>x.t==='image');
  const allImages = node.items.length>0 && imgs.length===node.items.length;
  const itemCards=node.items.map((v,i)=>card(v,false,i)).join('');
  const slide = imgs.length ? `<button class="btn ghost" id="slideBtn" style="padding:7px 14px">▶ Pase de diapositivas</button>` : '';

  main.innerHTML = crumbs
    + `<div class="topline"><h2>${escHtml(node.name)}</h2><span class="count">${node.items.length?word(node.items.length,activeMode):''}</span>${slide}</div>`
    + (folderCards?`<div class="grid folders">${folderCards}</div>`:'')
    + (itemCards?`<div class="grid${allImages?' photos':''}">${itemCards}</div>`:'')
    + (!folderCards&&!itemCards?`<div class="state" style="height:auto;margin-top:30px"><p>Esta carpeta está vacía.</p></div>`:'');

  main.querySelectorAll('.crumbs button[data-i]').forEach(b=> b.onclick=()=> openFolder(pathNodes.slice(0,+b.dataset.i+1)));
  main.querySelectorAll('.folder-card').forEach(b=> b.onclick=()=> openFolder([...pathNodes, node.folders[+b.dataset.fi]]));
  const sb=$('slideBtn'); if(sb) sb.onclick=()=> openLightbox(imgs,0,true);
  bindCards();
  tvFocusFirst();
}

function card(v, showPath, idx){
  const thumb=v.thumb?`<img src="${v.thumb}" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:'';
  const icon = v.t==='image'
    ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 9V4h5M20 15v5h-5M4 15v5h5M20 9V4h-5" stroke="#E8ECF1" stroke-width="1.7"/></svg>`
    : v.t==='audio'
    ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 17V5l10-2v12" stroke="#E8ECF1" stroke-width="1.6"/><circle cx="6.5" cy="17" r="2.5" stroke="#E8ECF1" stroke-width="1.6"/><circle cx="16.5" cy="15" r="2.5" stroke="#E8ECF1" stroke-width="1.6"/></svg>`
    : `<svg width="18" height="18" viewBox="0 0 24 24" fill="#E8ECF1"><path d="M8 5v14l11-7z"/></svg>`;
  return `<button class="card${v.t==='image'?' photo':''}" data-idx="${idx}" data-id="${v.id}" data-name="${encodeURIComponent(v.name)}" data-path="${encodeURIComponent(v.path||'')}" data-t="${v.t}">
    <div class="thumb">${thumb}<span class="badge">${icon}</span></div>
    <div class="name">${escHtml(v.name)}</div>${showPath&&v.path?`<div class="vpath">${escHtml(v.path)}</div>`:''}</button>`;
}
function bindCards(){ main.querySelectorAll('.card').forEach(c=> c.onclick=()=>{
  const t=c.dataset.t, idx=+c.dataset.idx;
  if(t==='image'){ const imgs=viewItems.filter(x=>x.t==='image'); const pos=imgs.findIndex(x=>x.id===c.dataset.id); openLightbox(imgs, Math.max(0,pos), false); }
  else openItem(c.dataset.id, decodeURIComponent(c.dataset.name), decodeURIComponent(c.dataset.path||''), t);
}); }

let searchTimer;
function onSearch(val){ clearTimeout(searchTimer); const term=val.trim();
  if(term.length<2){ if(searching){ if(currentPath.length) openFolder(currentPath); else showHome(); } return; }
  searchTimer=setTimeout(()=>runSearch(term),300); }
async function runSearch(term){
  searching=true; setActive(null); const mode=modeOf(searchScope), low=term.toLowerCase(); returnFn=()=>runSearch(term);
  if(!state[mode.key]){ main.innerHTML=spinner(`Indexando ${mode.label.toLowerCase()}…`); try{ await ensureData(mode); }catch(e){ showError('No se pudo indexar. '+e.message); return; } }
  const hits=state[mode.key].flat.filter(v=> v.name.toLowerCase().includes(low));
  viewItems=hits.slice();
  if(!hits.length){ main.innerHTML=`<div class="topline"><h2>Búsqueda en ${mode.label}</h2></div><div class="state" style="height:auto;margin-top:30px"><h3>Sin resultados</h3><p>Nada coincide con “${escHtml(term)}”.</p></div>`; return; }
  const imgs=hits.filter(x=>x.t==='image');
  const allImages = hits.length>0 && imgs.length===hits.length;
  const slide = imgs.length ? `<button class="btn ghost" id="slideBtn" style="padding:7px 14px">▶ Pase de diapositivas</button>` : '';
  main.innerHTML=`<div class="topline"><h2>Resultados en ${mode.label}</h2><span class="count">${word(hits.length,mode)}</span>${slide}</div><div class="grid${allImages?' photos':''}">${hits.map((v,i)=>card(v,true,i)).join('')}</div>`;
  const sb=$('slideBtn'); if(sb) sb.onclick=()=> openLightbox(imgs,0,true);
  bindCards();
  tvFocusFirst();
}

function openItem(id,name,path,t){
  const back=returnFn;
  const cls = t==='audio' ? ' audio' : '';
  const fsBtn = t==='audio' ? '' : `<button class="btn ghost" id="fsFrame" style="padding:7px 14px;margin-top:14px">⛶ Pantalla completa</button>`;
  main.innerHTML=`<div class="player"><button class="backbtn" id="back">← Volver</button>
    <div class="frame${cls}"><iframe src="https://drive.google.com/file/d/${id}/preview" allow="autoplay" allowfullscreen></iframe></div>
    <h2>${escHtml(name)}</h2>${path?`<div class="vpath">${escHtml(path)}</div>`:''}${fsBtn}</div>`;
  $('back').onclick=()=>(back||showHome)();
  const fb=$('fsFrame'); if(fb) fb.onclick=()=> toggleFs(document.querySelector('.player .frame'));
  updateFsLabels();
  $('back').focus({preventScroll:true});
}

/* lightbox / pase de diapositivas */
let lb={
  items:[], idx:0, playing:false, timer:null,
  loop: localStorage.getItem('mm_slide_loop')!=='0',                       // bucle (por defecto sí)
  interval: parseInt(localStorage.getItem('mm_slide_interval')) || SLIDE_SECONDS
};
function lbInitControls(){
  $('lbInterval').value = String(lb.interval);
  $('lbLoop').classList.toggle('on', lb.loop);
}
/* auto-ocultar los controles del visor (Salir/Bucle/Intervalo) para foto a pantalla completa real */
let lbHideTimer=null;
function lbShowUI(){ const lx=$('lightbox'); lx.classList.remove('tvhide'); clearTimeout(lbHideTimer);
  lbHideTimer=setTimeout(()=>{ if(!$('lightbox').classList.contains('hidden')) $('lightbox').classList.add('tvhide'); }, 4000); }
function lbHideUI(){ clearTimeout(lbHideTimer); $('lightbox').classList.add('tvhide'); }
let lbHistoryPushed=false;
function lbPop(){ if(!$('lightbox').classList.contains('hidden')) lbCloseInternal(); }
async function openLightbox(items, idx, autoplay){
  if(!items.length) return;
  lb.items=items; lb.idx=idx; lb.playing=false;
  lbInitControls();
  $('lightbox').classList.remove('hidden'); document.addEventListener('keydown', lbKey);
  // atrapa el botón "atrás" del mando: mientras el visor esté abierto, "atrás" lo cierra en vez de salir de la web
  lbHistoryPushed=false;
  try{ history.pushState({mmLightbox:1}, ''); lbHistoryPushed=true; window.addEventListener('popstate', lbPop); }catch(e){}
  lbShowUI();
  await lbShow(); if(autoplay) lbToggle(true);
}
async function lbShow(){
  const it=lb.items[lb.idx];
  $('lbStage').innerHTML='<div class="spinner"></div>';
  $('lbCounter').textContent=`${lb.idx+1} / ${lb.items.length}`; $('lbCaption').textContent=it.name;
  try{ const url=await getImageUrl(it.id); if(lb.items[lb.idx] && lb.items[lb.idx].id===it.id) $('lbStage').innerHTML=`<img src="${url}" alt="">`;
    const n=lb.items[(lb.idx+1)%lb.items.length]; if(n) getImageUrl(n.id).catch(()=>{}); }
  catch(e){ $('lbStage').innerHTML='<p style="color:var(--muted)">No se pudo cargar la imagen.</p>'; }
}
function lbAdvance(){ // auto-avance del temporizador
  if(lb.idx===lb.items.length-1){ if(!lb.loop){ lbToggle(false); return; } lb.idx=0; } else lb.idx++;
  lbShow();
}
function lbNext(){ if(lb.idx===lb.items.length-1){ if(!lb.loop) return; lb.idx=0; } else lb.idx++; lbShow(); }
function lbPrev(){ if(lb.idx===0){ if(!lb.loop) return; lb.idx=lb.items.length-1; } else lb.idx--; lbShow(); }
function lbToggle(force){ lb.playing=(force!==undefined)?force:!lb.playing; $('lbPlay').textContent=lb.playing?'⏸ Pausa':'▶ Reproducir'; clearInterval(lb.timer); if(lb.playing) lb.timer=setInterval(lbAdvance, lb.interval*1000); }
function lbCloseInternal(){ clearInterval(lb.timer); clearTimeout(lbHideTimer); lb.playing=false;
  $('lightbox').classList.remove('tvhide'); $('lightbox').classList.add('hidden');
  document.removeEventListener('keydown', lbKey); window.removeEventListener('popstate', lbPop);
  if(isFs()) toggleFs($('lightbox')); }
function lbClose(){ // salida "manual" (botón X o tecla): deshace la entrada de historial, lo que dispara lbPop -> lbCloseInternal
  if(lbHistoryPushed && history.state && history.state.mmLightbox){ lbHistoryPushed=false; history.back(); }
  else lbCloseInternal(); }
function lbKey(e){ lbShowUI();
  const dir=dpadDir(e);
  if(dir==='right'||dir==='down'){ if(e.preventDefault) e.preventDefault(); lbNext(); }
  else if(dir==='left'||dir==='up'){ if(e.preventDefault) e.preventDefault(); lbPrev(); }
  else if(isBackKey(e)){ if(e.preventDefault) e.preventDefault(); if(isFs()) toggleFs($('lightbox')); else lbClose(); }
  else if(isOkKey(e)){ if(e.preventDefault) e.preventDefault(); lbToggle(); }
  else if(e.key==='f'||e.key==='F'){ toggleFs($('lightbox')); } }
$('lbNext').onclick=lbNext; $('lbPrev').onclick=lbPrev; $('lbPlay').onclick=()=>lbToggle(); $('lbClose').onclick=lbClose;
$('lbLoop').onclick=()=>{ lb.loop=!lb.loop; localStorage.setItem('mm_slide_loop', lb.loop?'1':'0'); $('lbLoop').classList.toggle('on', lb.loop); };
$('lbInterval').onchange=(e)=>{ lb.interval=parseInt(e.target.value)||SLIDE_SECONDS; localStorage.setItem('mm_slide_interval', String(lb.interval)); if(lb.playing) lbToggle(true); };
$('lbFull').onclick=()=>{ toggleFs($('lightbox')); lbHideUI(); };
$('lightbox').addEventListener('pointermove', lbShowUI);
$('lbStage').addEventListener('click', lbShowUI);

/* pantalla completa (Fullscreen API) */
function isFs(){ return document.fullscreenElement || document.webkitFullscreenElement; }
function toggleFs(el){ if(isFs()){ (document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document); } else if(el){ (el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el); } }
function updateFsLabels(){ const on=!!isFs();
  const lf=$('lbFull'); if(lf){ lf.textContent = on?'⛶ Salir':'⛶ Solo imagen'; lf.classList.toggle('on', on); }
  const pf=$('fsFrame'); if(pf) pf.textContent = on?'⛶ Salir de pantalla completa':'⛶ Pantalla completa';
}
document.addEventListener('fullscreenchange', updateFsLabels);
document.addEventListener('webkitfullscreenchange', updateFsLabels);

function showError(msg){ main.innerHTML=`<div class="state"><h3>Algo no fue bien</h3><div class="err">${msg}</div><button class="btn" onclick="boot()">Reintentar</button></div>`; }
function escHtml(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

$('searchBox').addEventListener('input', e=>onSearch(e.target.value));
$('refreshBtn').onclick=()=>{ localStorage.removeItem('mm_tree_v2_'+activeMode.root); delete state[activeMode.key]; ensureMode(activeMode); };
$('signOut').onclick=()=>{ clearToken(); accessToken=null; hasConsented=false; showWelcome(); $('courseList').innerHTML='<div class="label">Carpetas</div>'; };

/* ================= Navegación con el mando de la TV (cruceta) ================= */
const NAV_SEL='a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),iframe,[tabindex]:not([tabindex="-1"])';
function navItems(){
  return [...document.querySelectorAll(NAV_SEL)].filter(el=>{
    if(el.id==='resizer' || el.closest('.hidden') || el.closest('#tvscroll')) return false;
    const r=el.getBoundingClientRect();
    return r.width>1 && r.height>1 && el.offsetParent!==null;
  });
}
function scrollNice(el){ try{ el.scrollIntoView({block:'center',inline:'center'}); }catch(e){ try{ el.scrollIntoView(); }catch(_){} } }
function scrollMain(delta){ try{ main.scrollBy(0,delta); }catch(e){ main.scrollTop += delta; } }
function moveFocus(dir){
  const items=navItems(); if(!items.length) return false;
  const cur=document.activeElement;
  if(!cur || cur===document.body || !items.includes(cur)){
    const t=main.querySelector(NAV_SEL)||items[0];
    if(t){ t.focus({preventScroll:true}); scrollNice(t); return true; }
    return false;
  }
  const r=cur.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  let best=null, bestScore=Infinity;
  for(const el of items){
    if(el===cur) continue;
    const b=el.getBoundingClientRect(), bx=b.left+b.width/2, by=b.top+b.height/2;
    const dx=bx-cx, dy=by-cy; let along, across;
    if(dir==='left'){ if(dx>-6) continue; along=-dx; across=Math.abs(dy); }
    else if(dir==='right'){ if(dx<6) continue; along=dx; across=Math.abs(dy); }
    else if(dir==='up'){ if(dy>-6) continue; along=-dy; across=Math.abs(dx); }
    else { if(dy<6) continue; along=dy; across=Math.abs(dx); }
    const score=along + across*2.4;
    if(score<bestScore){ bestScore=score; best=el; }
  }
  if(best){ best.focus({preventScroll:true}); scrollNice(best); return true; }
  return false;
}
function tvFocusFirst(){
  const el = main.querySelector('.folder-card,.card,.backbtn,.crumbs button,#connectBtn,.btn')
          || document.querySelector('#courseList .course');
  if(el) el.focus({preventScroll:true});
}
/* normaliza teclas del mando: algunos navegadores de TV no rellenan e.key, solo keyCode,
   y algunos pasan los códigos crudos de Android (DPAD 19-23) en vez de 37-40 */
function dpadDir(e){
  const k=e.key||'', c=e.keyCode||e.which||e.detail||0;
  if(k==='ArrowUp'||k==='Up'||c===38||c===19) return 'up';
  if(k==='ArrowDown'||k==='Down'||c===40||c===20) return 'down';
  if(k==='ArrowLeft'||k==='Left'||c===37||c===21) return 'left';
  if(k==='ArrowRight'||k==='Right'||c===39||c===22) return 'right';
  return null;
}
function isOkKey(e){
  const k=e.key||'', c=e.keyCode||e.which||0;
  return k==='Enter'||k===' '||k==='Spacebar'||c===13||c===23||c===32||c===66;
}
function isBackKey(e){
  const k=e.key||'', c=e.keyCode||e.which||0;
  return k==='Backspace'||k==='BrowserBack'||k==='GoBack'||k==='Escape'||k==='XF86Back'
      || c===8||c===27||c===4||c===461||c===10009;
}
function pageDir(e){
  const k=e.key||'', c=e.keyCode||e.which||0;
  if(k==='PageDown'||k==='ChannelDown'||c===34||c===428||c===167) return 'down';
  if(k==='PageUp'||k==='ChannelUp'||c===33||c===427||c===166) return 'up';
  return null;
}
const tvHandled=(typeof WeakSet!=='undefined')?new WeakSet():null;
function tvKeyHandler(e){
  if(tvHandled){ if(tvHandled.has(e)) return; tvHandled.add(e); }
  const lx=$('lightbox'); if(lx && !lx.classList.contains('hidden')) return;   // el visor gestiona sus propias teclas
  if(e.altKey||e.ctrlKey||e.metaKey) return;
  const t=e.target, tag=((t&&t.tagName)||'').toLowerCase();
  if(tag==='iframe'){ if(isBackKey(e)){ const b=$('back'); if(b){ e.preventDefault(); b.click(); } } return; }
  if(tag==='input' || tag==='textarea'){ if(dpadDir(e)==='down'){ e.preventDefault(); tvFocusFirst(); } return; }
  // OK / centro del mando: si el navegador manda el código crudo de Android (23/66) el botón no se activa solo
  if(isOkKey(e) && (e.keyCode===23||e.keyCode===66)){
    const a=document.activeElement;
    if(a && a!==document.body && typeof a.click==='function'){ e.preventDefault(); a.click(); }
    return;
  }
  const dir=dpadDir(e);
  if(dir){
    let acted=moveFocus(dir);
    if(!acted && (dir==='down'||dir==='up')){ scrollMain((dir==='down'?1:-1)*Math.round(main.clientHeight*0.82)); acted=true; }
    if(acted && e.preventDefault) e.preventDefault();
    return;
  }
  const pg=pageDir(e);
  if(pg){ scrollMain((pg==='down'?1:-1)*Math.round(main.clientHeight*0.9)); if(e.preventDefault) e.preventDefault(); return; }
  if(isBackKey(e)){ const b=$('back'); if(b){ e.preventDefault(); b.click(); } }
}
window.addEventListener('keydown', tvKeyHandler, true);

/* botones flotantes de scroll / volver */
$('tvUp').onclick  =()=> scrollMain(-Math.round(main.clientHeight*0.82));
$('tvDown').onclick=()=> scrollMain( Math.round(main.clientHeight*0.82));
$('tvBack').onclick=()=>{ const b=$('back'); if(b) b.click(); else if(typeof showHome==='function') showHome(); };

/* diagnóstico de teclas: abre la página con ?debug=1 y pulsa el mando */
if(location.search.indexOf('debug')>-1){
  const d=document.createElement('div');
  d.style.cssText='position:fixed;left:8px;bottom:8px;z-index:99999;background:#000;color:#0f0;font:14px/1.4 monospace;padding:8px 12px;border:1px solid #0f0;pointer-events:none;max-width:90vw';
  d.textContent='DEBUG teclas — pulsa la cruceta del mando';
  document.addEventListener('DOMContentLoaded',()=>document.body.appendChild(d));
  if(document.body) document.body.appendChild(d);
  const hist=[];
  const show=(tag,e)=>{ hist.unshift(`${tag} key="${e.key}" code="${e.code}" keyCode=${e.keyCode} which=${e.which} -> dir=${dpadDir(e)||'-'} back=${isBackKey(e)} ok=${isOkKey(e)}`);
    hist.length=Math.min(hist.length,6); d.textContent='DEBUG mando:\n'+hist.join('\n'); };
  d.style.whiteSpace='pre';
  window.addEventListener('keydown',e=>show('keydown',e),true);
  window.addEventListener('keyup',e=>show('keyup',e),true);
  ['click'].forEach(t=>window.addEventListener(t,e=>{ hist.unshift('click en '+((e.target&&e.target.tagName)||'?')+'.'+((e.target&&e.target.className)||'')); hist.length=Math.min(hist.length,6); d.textContent='DEBUG mando:\n'+hist.join('\n'); },true));
}

boot();
</script>
</body>
</html>
